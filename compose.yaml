services:
  music_player:
    image: music_player
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 80:80
    volumes:
      - data:/app/data
      - ./import_docker:/app/data/music
    environment:
      - DOCKER=True
      - YT_FOLDER=/app/data/yt
      - MUSIC_FOLDER=/app/music
      - COVER_FOLDER=/app/data/cover
volumes:
  data: