<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Testo Canzone</title>
        <!-- per i colori della wave -->
        <script src="https://cdn.jsdelivr.net/npm/colorthief@2.4.0/dist/color-thief.umd.js"></script> 
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;1,500&display=swap");
            ::-webkit-scrollbar {
                display: none !important;
            }
            * {
                scrollbar-width: none !important;
            }
            body {
                font-family: "Montserrat", sans-serif;
                font-weight: 600;
                color: #bdbdbd;
                padding: 20px;
                display: grid;
                justify-content: center;
                justify-items: center;
                background-color: #1e1e1e;
                margin: 0;
                overflow-x: hidden;
                min-height: 100vh;
            }
            body::after {
                content: '';
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.67);
                z-index: -1;
            }
            #bg-layer {
                position: fixed;
                inset: 0;
                z-index: -3;
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                background-color: #1e1e1e;
                filter: blur(60px);
                transform: scale(1.15); /* evita bordi chiari dovuti al blur sui margini */
            }

            .lyric-line {
                margin-bottom: 12px;
                font-size: 18px;
                line-height: 3;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .lyric-line:first-of-type {
                margin-top: 50vh;
            }
            .lyric-line:last-of-type {
                margin-bottom: 50vh;
            }

            #container{
                text-align: center;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                align-content: center;
                justify-content: center;
                align-items: flex-start;
            }

            .si {
                transform: scale(1.5);
            }
            .si span {
                color: #fff;
                text-shadow:
                0 0 11px #7777ff,
                0 0 19px blue,
                0 0 40px blue;
            }

            #container.fullscreen .si {
                transform: scale(1.8);
            }
            #container.fullscreen .lyric-line {
                font-size: 30px;
            }
            
            @media (max-width: 800px) {
                .lyric-line {
                    font-size: 16px;
                    line-height: 2.5;
                    margin-left: 5px;
                    margin-right: 5px;
                }
                .si {
                    transform: scale(1.3);
                }
                #container.fullscreen .si{
                    transform: scale(1.3);
                }
                #container.fullscreen .lyric-line {
                    font-size: 16px;
                }
            }
        </style>
    </head>
    <body>
        <!-- <audio controls id="audioPlayer">
        <source src="http://localhost/Tha%20Supreme/gua10%20-%20feat.%20Lazza.flac" type="audio/flac">
    </audio> -->
        <div id="bg-layer"></div>
        <div id="container">
            <div id="testo-output">Caricamento del testo in corso...</div>
        </div>
        <div id="audioviz" style="
            width:100%;
            height:200px;
            position: fixed;
            bottom: 0;
            z-index: -1;
            pointer-events: none;
            height: 100%;
            display: flex;
            transform: scaleY(0.6);
            transform-origin: bottom;
        "></div>

        <script type="module">
            import AudioMotionAnalyzer from 'https://cdn.jsdelivr.net/npm/audiomotion-analyzer@4/+esm';

            const params = new URLSearchParams(window.location.search);
            const path = params.get("path");

            let lyricsArray = null;
            let audioPlayer = window.parent.document.getElementById("audioPlayer");
            let ultimoIndice = -1;

            const updateProgress = setInterval(() => {
                centraTesto();
            }, 500);

            function centraTesto(force = false) {
                if (audioPlayer && audioPlayer.currentTime && lyricsArray) {
                    const index = getCurrentLrcIndex(lyricsArray, audioPlayer.currentTime);

                    if (index !== -1 && index !== ultimoIndice || force) {
                        ultimoIndice = index;

                        ingrandisciTesto(index);

                        const rigaAttiva = document.querySelector(".si");
                        if (rigaAttiva) {
                            rigaAttiva.scrollIntoView({
                                behavior: "smooth",
                                block: "center",
                            });
                        }
                    }
                }
            }

            function ingrandisciTesto(a) {
                let testoDiv = document.getElementById("testo-output");
                testoDiv.children[a].classList.add("si");
                if (a !== 0) testoDiv.children[a - 1].classList.remove("si");
            }

            function getCurrentLrcIndex(lrcArray, currentTime) {
                function parseTime(tag) {
                    if (typeof tag !== "string") return null;

                    const match = tag.match(/\[(\d{2}):(\d{2}\.\d{2})\]/);
                    if (!match) return null;

                    const minutes = parseInt(match[1], 10);
                    const seconds = parseFloat(match[2]);

                    return minutes * 60 + seconds;
                }

                let index = -1;

                for (let i = 0; i < lrcArray.length; i++) {
                    const time = parseTime(lrcArray[i].originalTime);
                    if (time === null) continue;

                    if (currentTime >= time) {
                        index = i;
                    } else {
                        break;
                    }
                }

                return index;
            }
            // Funzione per fare il fetch del testo
            async function fetchLyrics() {
                try {
                    // ATTENZIONE: Sostituisci 'testo.lrc' con l'URL o il percorso reale del tuo file
                    // Es: fetch('https://tuosito.com/testo.txt')
                    const response = await fetch("get_lyrics/" + path);

                    if (!response.ok) {
                        throw new Error(`${response.status}`);
                    }

                    const lrcText = await response.text();
                    displayLyrics(lrcText);
                } catch (error) {
                    if (error.message === "404") {
                        document.getElementById("testo-output").innerHTML =
                            `<p style="color: #ff4d4d;">Testo non trovato</p>`;
                    } else {
                        document.getElementById("testo-output").innerHTML =
                            `<p style="color: #ff4d4d;">Errore nel caricamento del file: ${error.message}</p>
                     <p style="font-size: 14px; color: #888;">Assicurati che il file esista e che tu stia usando un server locale (es. Live Server) per evitare errori CORS.</p>`;
                    }
                    console.error("Dettaglio errore:", error);
                }
            }

            // Funzione per analizzare il formato LRC (supporta anche testi senza timestamp)
            function parseLRC(text) {
                const lines = text.split("\n");
                const parsedLyrics = [];

                // RegEx per cercare la struttura [mm:ss.xx]Testo
                const regex = /\[(\d{2}):(\d{2}\.\d{2})\](.*)/;

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine === "") return; // ignora righe vuote

                    const match = trimmedLine.match(regex);
                    if (match) {
                        const textContent = match[3].trim();
                        // Aggiungiamo il testo solo se c'è (ignoriamo righe vuote)
                        if (textContent !== "") {
                            parsedLyrics.push({
                                originalTime: `[${match[1]}:${match[2]}]`,
                                text: textContent,
                            });
                        }
                    } else {
                        // Se non c'è un timestamp, inseriamo la linea come testo libero
                        parsedLyrics.push({
                            originalTime: null,
                            text: trimmedLine,
                        });
                    }
                });
                return parsedLyrics;
            }

            // Funzione per stampare in pagina l'HTML
            function displayLyrics(rawText) {
                const outputDiv = document.getElementById("testo-output");
                outputDiv.innerHTML = ""; // Svuota il "caricamento in corso"

                lyricsArray = parseLRC(rawText);

                lyricsArray.forEach(line => {
                    const p = document.createElement("p");
                    p.className = "lyric-line";

                    // Creiamo lo span per il testo
                    const textSpan = document.createElement("span");
                    textSpan.className = "text";
                    textSpan.textContent = line.text;

                    // p.appendChild(timeSpan);
                    p.appendChild(textSpan);

                    outputDiv.appendChild(p);
                });
            }

            // Avviamo il processo
            if (window.parent.document.getElementById('cover-container').classList.contains('cover404'))
                document.getElementById('bg-layer').style.backgroundImage = "none";
            else
                document.getElementById('bg-layer').style.backgroundImage = `url(${window.parent.document.getElementById('cover').src})`;

            // Waveform
            // NOTA: non passiamo audioPlayer direttamente perché appartiene al
            // realm del parent (instanceof HTMLMediaElement fallirebbe) e perché
            // createMediaElementSource può essere chiamato una sola volta per
            // elemento audio in tutta la sua vita: lo creiamo quindi nel parent
            // (index.html) una volta sola e qui lo riusiamo tramite window.parent.
            let audioMotion = null;
            if (window.parent.audioSourceNode && window.parent.audioCtx) {
                audioMotion = new AudioMotionAnalyzer(
                    document.getElementById('audioviz'),
                    {
                        source: window.parent.audioSourceNode,
                        audioCtx: window.parent.audioCtx,
                        height: 600,
                        mode: 7,
                        showScaleX: false,
                        showPeaks: false,
                        smoothing: 0.7,
                        overlay: true,
                        bgAlpha: 0,
                        mirror: 1,
                        connectSpeakers: false, // il routing verso la destination è già gestito da index.html
                    }
                );
                audioMotion.registerGradient('grigio', {
                    colorStops: [
                        { color: 'grey', pos: .6 },
                    ]
                });
                audioMotion.gradient = 'grigio';

                applyCoverPalette(audioMotion);
            } else {
                console.warn('audioSourceNode/audioCtx non disponibili sul parent: waveform non inizializzata');
            }

            function lightenColor([r, g, b], amount = 0.25) {
                // Schiarisce un colore [r,g,b] mescolandolo con il bianco.
                // amount va da 0 (nessun cambiamento) a 1 (bianco puro).
                return [
                    Math.round(r + (255 - r) * amount),
                    Math.round(g + (255 - g) * amount),
                    Math.round(b + (255 - b) * amount),
                ];
            }
            function applyCoverPalette(audioMotion) {
                const coverImg = window.parent.document.getElementById('cover');
                if (!coverImg || !coverImg.src) return;

                const extract = () => {
                    const colorThief = new ColorThief();
                    // 5 colori dominanti, ordinati per prevalenza nell'immagine
                    const palette = colorThief.getPalette(coverImg, 5);

                    audioMotion.registerGradient('coverGradient', {
                        colorStops: palette.map((rgb, i) => {
                            const [r, g, b] = lightenColor(rgb, 0.25);
                            return {
                                color: `rgba(${r}, ${g}, ${b}, 0.4)`,
                                // palette[0] è il colore più dominante: gli diamo il pos più alto
                                pos: (palette.length - 1 - i) / (palette.length - 1),
                            };
                        }),
                    });
                    audioMotion.gradient = 'coverGradient';
                };

                if (coverImg.complete && coverImg.naturalWidth > 0) {
                    extract();
                } else {
                    coverImg.addEventListener('load', extract, { once: true });
                }
            }

            // Quando l'iframe viene distrutto (si chiude la modale in index.html)
            // fermiamo il rendering per evitare leak di animation frame (idk chiedi a claude).
            window.addEventListener('pagehide', () => {
                if (audioMotion) audioMotion.destroy();
            });

            fetchLyrics();
        </script>
    </body>
</html>
