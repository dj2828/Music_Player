<!doctype html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">

	<title>Music Player</title>
    <link rel="icon" type="image/png" href="/static/IO.png">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://kit.fontawesome.com/b4ceb7d98e.js" crossorigin="anonymous"></script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Player">
    <link rel="apple-touch-icon" href="/static/IO_apple.png">
</head>
<body>
    <div class="container">
        <div class="music-player">
        <nav>
            <div onclick="openMenu()" class="circle">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div id="divol">
                <input type="range" value="100" id="volumeslider">
                <div onclick="vol()" class="circle" id="volume">
                    <i class="fa-solid fa-volume-low"></i>
                </div>
            </div>
        </nav>
        <h1 id="titolo">TITOLO</h1>
        <p id="cartella" style="font-weight: normal;">CARTELLA</p>

        <img src="" id="cover" class="cover404">

        <audio id="audioPlayer">
            <source id="audioSource" src="" type="audio/mpeg">
        </audio>
        <input type="range" value="0" id="progress">

        <div class="controls">
            <div onclick="prevSong()"><i class="fa-solid fa-backward"></i></div>
            <div onclick="togglePlay()"><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
            <div onclick="nextSong()"><i class="fa-solid fa-forward"></i></div>
        </div>
        </div>

<!-- -------------------------------------------------------------- -->

    {% for folder, albums in songs_by_folder.items() %}
    <div class="cartella">
        <div class="title">
            <h2>{{ folder }}</h2>
            <div onclick="playFolderRandom('{{ folder }}')" class="circle"><i class="fa-solid fa-shuffle"></i></div>
        </div>
        
        {% for album_name, songs in albums.items() %}
            <div class="album-container">
                <h3 class="album-title {{ 'singoli-title' if album_name == 'Brani Singoli' else '' }}">
                    {% if album_name != 'Brani Singoli' %}<i class="fa-solid fa-compact-disc"></i> {% endif %}
                    {{ album_name }}
                </h3>
                
                <div>
                {% for song in songs %}
                    <button onclick='playSong("{{ folder }}/{{ song }}")' class="song">
                        <h3>{{ song.replace('.mp3', '').replace('.flac', '') }}</h3>
                    </button>
                {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
    {% endfor %}
    </div>
    <script>
        // Crea la playlist con tutte le canzoni (cartella e nome)
        const playlist = [];
        {% for folder, albums in songs_by_folder.items() %}
            {% for album_name, songs in albums.items() %}
                {% for song in songs %}
                    playlist.push({ folder: {{ folder|tojson }}, song: {{ song|tojson }} });
                {% endfor %}
            {% endfor %}
        {% endfor %}

        let progress = document.getElementById('progress');
        let audioPlayer = document.getElementById('audioPlayer');
        let ctrlIcon = document.getElementById('ctrlIcon');
        let titoloObj = document.getElementById('titolo');
        let cartellaObj = document.getElementById('cartella');
        let googleHome = false;

        // Funzione per salvare l'URL nel cookie
        function setLastPlayedMp3Url(url) {
            document.cookie = "lastMp3Url=" + encodeURIComponent(url) + "; path=/; max-age=31536000";
        }

        // Funzione per leggere l'URL dal cookie
        function getLastPlayedMp3Url() {
            const match = document.cookie.match(/(?:^|; )lastMp3Url=([^;]*)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        audioPlayer.onloadedmetadata = function() {
            progress.max = audioPlayer.duration;
            progress.value = audioPlayer.currentTime;
        };

        function play(a){
            if(a){
                ctrlIcon.classList.remove('fa-play');
                ctrlIcon.classList.add('fa-pause');
                
            } else {
                ctrlIcon.classList.remove('fa-pause');
                ctrlIcon.classList.add('fa-play');
            }
            try {
                pywebview.api.setPlay(a);
            } catch (error) {}
        }

        function togglePlay(a) {
            if(ctrlIcon.classList.contains('fa-play') || a) {
                if (googleHome) {
                    googleHomeF('play');
                    play(true);
                    return;
                }
                audioPlayer.play();
                play(true);
            } else {
                if (googleHome) {
                    googleHomeF('pause');
                    play(false);
                    return;
                }
                audioPlayer.pause();
                play(false);
            }
        }

        if(audioPlayer.play()){
            setInterval(function() {
                progress.value = audioPlayer.currentTime;
            }, 50);
        }

        progress.oninput = function() {
            if(ctrlIcon.classList.contains('fa-pause')){
                audioPlayer.play();
                play(true);
            }
            audioPlayer.currentTime = progress.value;
        };

        document.getElementById('volumeslider').oninput = function() {
            audioPlayer.volume = document.getElementById('volumeslider').value / 100;
        };

        function vol() {
            const volumeSlider = document.getElementById('volumeslider');
            if (audioPlayer.volume != 20/100) {
                volumeSlider.value = 20;
                audioPlayer.volume = 20 / 100;
            } else {
                volumeSlider.value = 100;
                audioPlayer.volume = 1;
            }
        }

        window.addEventListener('keydown', function(e) {
            if (
                (e.key === " " || e.code === "Space" || e.key === "Spacebar") &&
                !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)
            ) {
                e.preventDefault();
                togglePlay();
            }
        });

        let currentIndex = -1;
        let randomFolderPlaylist = null;
        let historyStack = [];

        function playSong(songPath, customPlaylist = null, customIndex = null, fromHistory = false, playImmediately = true) {
            let titolo = songPath.split('/').pop().replace(/\.(mp3|flac)$/i, '');
            let cartella = songPath.split('/')[0];
            titoloObj.textContent = titolo;
            cartellaObj.textContent = cartella;
            document.title = titolo;

            // manda robe a miniplayer
            try {
                pywebview.api.setSong(songPath, titolo, cartella);
            } catch (error) {}

            const audioPlayer = document.getElementById('audioPlayer');
            const audioSource = document.getElementById('audioSource');
            const [folder, song] = songPath.split('/');
            const url = "{{ url_for('music', folder='FOLDER', filename='SONG') }}"
                .replace('FOLDER', encodeURIComponent(folder))
                .replace('SONG', encodeURIComponent(song));
            // Salva l'URL nel cookie
            setLastPlayedMp3Url(url);

            // immagine
            const immagine = document.getElementById('cover');
            let img = `/img?folder=${encodeURIComponent(folder)}&filename=${encodeURIComponent(song)}`;
            fetch(img)
                .then(response => {
                    if (response.status === 404) {
                        immagine.src = "/static/d.png";
                        immagine.classList.remove('cover');
                        immagine.classList.add('cover404');
                        return null;
                    } else {
                        immagine.classList.remove('cover404');
                        immagine.classList.add('cover');
                        return response.blob();
                    }
                })
                .then(blob => {
                    if (blob) {
                        immagine.src = URL.createObjectURL(blob);
                    }
                
                // img per player di ios (è ne fetch per la var img)
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                    title: titolo,
                    artist: "",
                    album: "",
                    artwork: [
                        { src: img, sizes: "512x512", type: "image/jpeg" }
                    ]
                    });
                    navigator.mediaSession.setActionHandler("play", () => togglePlay());
                    navigator.mediaSession.setActionHandler("pause", () => togglePlay());
                    navigator.mediaSession.setActionHandler("nexttrack", () => nextSong());
                    navigator.mediaSession.setActionHandler("previoustrack", () => prevSong());
                    navigator.mediaSession.setActionHandler('seekto', (details) => {
                        if (details.fastSeek && 'fastSeek' in audioPlayer) {
                        audioPlayer.fastSeek(details.seekTime);
                        } else {
                        audioPlayer.currentTime = details.seekTime;
                        }
                    });
                }
            });

            if (googleHome) {
                play(true);
                googleHomeF(url);
            }else{
                audioSource.src = url;
                audioPlayer.load();
                console.log('Playing song:', url);
                if (playImmediately) togglePlay(true);
            }

            // Trova l'indice della canzone nella playlist attuale
            let idx;
            if (customPlaylist) {
                idx = customIndex;
            } else {
                idx = playlist.findIndex(item => item.folder === folder && item.song === song);
            }

            // Aggiorna lo storico solo se non viene da prevSong
            if (!fromHistory && currentIndex !== -1) {
                historyStack.push({
                    playlist: randomFolderPlaylist ? [...randomFolderPlaylist] : null,
                    index: currentIndex
                });
            }

            // Aggiorna playlist e indice correnti
            if (customPlaylist) {
                randomFolderPlaylist = customPlaylist;
                currentIndex = idx;
            } else {
                randomFolderPlaylist = null;
                currentIndex = idx;
            }

            nextSongPreload();
        }

        function playFolderRandom(folder) {
            // Filtra le canzoni della cartella
            const folderSongs = playlist.filter(item => item.folder === folder);
            // Mischia le canzoni
            const shuffled = folderSongs.sort(() => Math.random() - 0.5);
            if (shuffled.length > 0) {
                playSong(shuffled[0].folder + '/' + shuffled[0].song, shuffled, 0);
            }
        }

        document.getElementById('audioPlayer').addEventListener('ended', function() {
            nextSong();
        });

        function nextSong() {
            if (randomFolderPlaylist) {
                if (currentIndex + 1 < randomFolderPlaylist.length) {
                    const next = randomFolderPlaylist[currentIndex + 1];
                    playSong(next.folder + '/' + next.song, randomFolderPlaylist, currentIndex + 1);
                }
                // Se randomFolderPlaylist è attiva e siamo all'ultima canzone, si ferma (non fa nulla)
            } else if (currentIndex >= 0) {
                // Siamo nella playlist globale: controlla se siamo all'ultima canzone della cartella
                const currentFolder = playlist[currentIndex].folder;
                // Trova tutte le canzoni di questa cartella
                const songsInFolder = playlist.filter(item => item.folder === currentFolder);
                // Trova la posizione della canzone corrente nella cartella
                const currentSongInFolder = songsInFolder.findIndex(item =>
                    item.folder === playlist[currentIndex].folder &&
                    item.song === playlist[currentIndex].song
                );
                if (currentSongInFolder + 1 < songsInFolder.length) {
                    // Vai alla prossima canzone della stessa cartella
                    const nextInFolder = songsInFolder[currentSongInFolder + 1];
                    // Trova l'indice globale della prossima canzone della cartella
                    const globalIndex = playlist.findIndex(item =>
                        item.folder === nextInFolder.folder && item.song === nextInFolder.song
                    );
                    playSong(nextInFolder.folder + '/' + nextInFolder.song, null, globalIndex);
                } else {
                    // Siamo all'ultima canzone della cartella: riparti dalla prima della cartella
                    const firstInFolder = songsInFolder[0];
                    const globalIndex = playlist.findIndex(item =>
                        item.folder === firstInFolder.folder && item.song === firstInFolder.song
                    );
                    playSong(firstInFolder.folder + '/' + firstInFolder.song, null, globalIndex);
                }
            }
        }

        function prevSong() {
            if (audioPlayer.currentTime <= (audioPlayer.duration*2)/100){
                if (historyStack.length > 0) {
                    const last = historyStack.pop();
                    if (last.playlist) {
                        playSong(last.playlist[last.index].folder + '/' + last.playlist[last.index].song, last.playlist, last.index, true);
                    } else {
                        playSong(playlist[last.index].folder + '/' + playlist[last.index].song, null, last.index, true);
                    }
                }
            }
            else{
                audioPlayer.currentTime = 0;
            }
        }

        // si scaria la prossima canzone
        function nextSongPreload() {
            let next;
            if (randomFolderPlaylist && currentIndex + 1 < randomFolderPlaylist.length) {
                next = randomFolderPlaylist[currentIndex + 1];
            } else if (!randomFolderPlaylist && currentIndex + 1 < playlist.length) {
                next = playlist[currentIndex + 1];
            }
            if (next) {
                const preloadLink = document.createElement('link');
                preloadLink.rel = 'preload';
                preloadLink.as = 'fetch';
                preloadLink.href = `/` + encodeURIComponent(next.folder) + `/` + encodeURIComponent(next.song);
                document.head.appendChild(preloadLink);
            }
        }

        // All'avvio, recupera l'ultimo mp3 dal cookie e formatta l'URL in modo leggibile
        const lastMp3Url = getLastPlayedMp3Url();
        if (lastMp3Url) {
            const formattedUrl = decodeURIComponent(lastMp3Url).slice(1);
            console.log('Ultimo mp3 dal cookie (formattato):', formattedUrl);
            playSong(formattedUrl, null, null, null, false);
        } else {
            console.log('Nessun mp3 trovato nel cookie.');
        }

        function googleHomeF(url){
            fetch("/google", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "url=" + encodeURIComponent(url)
            }).then(response => {
                if (response.status === 1) {
                    closeMenu();
                    alert("Google Home attivato");
                }
                if (response.status === 404) {
                    window.location.href = "/errore?motivo=Google%20Home%20non%20trovato";
                }
            });
            return;
        }

        // conteggio riproduzioni
            let playCounted = false;
            audioPlayer.addEventListener('play', function() {
                playCounted = false; 
            });

            audioPlayer.addEventListener('timeupdate', function() {
                // Verifica se sono passati 30 secondi E se non abbiamo ancora contato la riproduzione
                if (!playCounted && audioPlayer.currentTime >= 30) {
                    countPlay();
                    playCounted = true; // Impedisce nuovi invii finché non cambia brano
                }
            });

            // Funzione dedicata all'invio dei dati
            function countPlay() {
                const songPath = playlist[currentIndex-1].folder + '/' + playlist[currentIndex-1].song;
                
                fetch('/increment_plays', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'song=' + encodeURIComponent(songPath)
                })
                .then(response => console.log('Riproduzione conteggiata'))
                .catch(error => console.error('Errore nel conteggio:', error));
            }

            // Mantieni 'ended' solo per passare alla prossima canzone
            audioPlayer.addEventListener('ended', function() {
                nextSong();
            });
    </script>

    <div id="menu" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:#ff5500; color:#000; padding:30px 20px; border-radius:12px; min-width:600px; max-width:90vw; min-height: 300px; margin:auto; position:relative; display: flex; align-items: center; justify-content: center;">
            <div onclick="openModal()" class="circle">
                <i class="fa-solid fa-download"></i>
            </div>
            <div onclick="if(googleHome){googleHome=false; googleHomeF('stop'); play(false); closeMenu()} else{googleHomeF('init'); googleHome=true; audioPlayer.pause(); play(false);};" class="circle">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <div onclick="window.location.reload()" class="circle">
                <i class="fa-solid fa-rotate-right"></i>
            </div>
        </div>
    </div>

    <div id="downloadModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100vw; height:100vh; align-items:center; justify-content:center;">
        <div style="background:#ff5500; color:#000; padding:30px 20px; border-radius:12px; min-width:600px; max-width:90vw; min-height: 300px; margin:auto; position:relative; display: flex; align-items: center; justify-content: center;">
            <button onclick="closeModal()" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:22px; cursor:pointer;">&times;</button>
            <div style="text-align:center;">
                <input type="text" id="yt_url" placeholder="Incolla link YouTube || Cerca su YouTube" style="width:300px; border-radius: 20px; padding: 20px; font-size: medium; font-weight: normal;">
                <button onclick="downloadYT()" class="song">Scarica da YouTube</button>
                <div id="downloadMsg" style="color:black; margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <script>
    async function downloadYT(url=null) {
        if (url === null) url = document.getElementById('yt_url').value;
        const msgDiv = document.getElementById('downloadMsg');
        
        if (!url.trim()) {
            msgDiv.textContent = 'Inserisci un URL o una ricerca';
            msgDiv.style.color = 'blue';
            return;
        }
        if(url.startsWith('http://') || url.startsWith('https://')){
            msgDiv.textContent = 'Download in background avviato.';
            msgDiv.style.color = 'black';

            const response = await fetch('/down', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'yt_url=' + encodeURIComponent(url)
            });
            const status = response.status;
            if (status === 200) window.location.reload();
            else if (status === 500) {
                msgDiv.textContent = 'Errore durante il download.';
                msgDiv.style.color = 'blue';
            }
        }
        else{
            // è una ricerca
            msgDiv.textContent = 'Ricerca in corso...';
            msgDiv.style.color = 'black';
            const response = await fetch('/cerca?q=' + encodeURIComponent(url));
            const results = await response.json();
            
            if (results.error) {
                msgDiv.textContent = results.error;
                msgDiv.style.color = 'red';
                return;
            }
            
            if (results.length === 0) {
                msgDiv.textContent = 'Nessun risultato trovato.';
                msgDiv.style.color = 'red';
                return;
            }
            
            // Mostra i risultati della ricerca
            let resultsHtml = '<h3>Risultati della ricerca:</h3><div id="resultsList"><ul>';
            results.forEach(video => {
                resultsHtml += `<li>
                    <strong>${video.title}</strong><br>
                    <p>${video.channel}</p>
                    <button onclick="downloadYT('${video.url}')" class="song" style="margin-top:5px;">Scarica questo</button>
                </li><br>`;
            });
            resultsHtml += '</ul></div>';
            msgDiv.innerHTML = resultsHtml;
        }
    }


    function openModal() {
        document.getElementById('downloadModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('downloadModal').style.display = 'none';
    }
    // Chiudi modale con ESC o clic fuori
    window.addEventListener('keydown', function(e) {
        if (e.key === "Escape") closeModal();
    });
    document.getElementById('downloadModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    function openMenu() {
        document.getElementById('menu').style.display = 'flex';
    }
    function closeMenu() {
        document.getElementById('menu').style.display = 'none';
    }
    // Chiudi modale con ESC o clic fuori
    window.addEventListener('keydown', function(e) {
        if (e.key === "Escape") closeMenu();
    });
    document.getElementById('menu').addEventListener('click', function(e) {
        if (e.target === this) closeMenu();
    });


    // offline popup + controllo disponibilità server
    // popup HTML (verrà mostrato quando il server non risponde)
    const offlinePopupHtml = `
    <div id="offlinePopup" style="display:none; position:fixed; z-index:3000; left:0; top:0; width:100vw; height:100vh; align-items:center; justify-content:center; background:rgba(0,0,0,0.5);">
        <div style="background:#222; color:#fff; padding:20px; border-radius:8px; min-width:300px; text-align:center;">
            <h3 id="offlineTitle">Server non raggiungibile</h3>
            <p id="offlineMsg">Sto tentando di riconnettere...</p>
            <button id="offlineRetry" class="song" style="margin-top:12px;">Riprova ora</button>
        </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend', offlinePopupHtml);

    // Funzione di controllo ping con backoff esponenziale
    (function() {
        const offlinePopup = document.getElementById('offlinePopup');
        const offlineMsg = document.getElementById('offlineMsg');
        const offlineRetry = document.getElementById('offlineRetry');
        let isOffline = false;
        let retryDelay = 2000; // ms
        const maxDelay = 60000; // ms
        let retryTimer = null;

        async function doPing() {
            try {
                const resp = await fetch('/ping?ts=' + Date.now(), { cache: 'no-store' });
                if (resp && resp.ok) {
                    if (isOffline) {
                        // Torna online: nascondi popup e ricarica per sincronizzare lo stato
                        isOffline = false;
                        offlinePopup.style.display = 'none';
                        retryDelay = 2000;
                        console.log('Server online di nuovo. Ricarico per sincronizzare.');
                        // ricarica la pagina per ristabilire lo stato (caricare risorse dal server)
                        window.location.reload();
                    }
                    return true;
                }
            } catch (err) {
                // errore di rete
            }
            // Se arriviamo qui, ping fallito
            if (!isOffline) {
                isOffline = true;
                offlinePopup.style.display = 'flex';
            }
            offlineMsg.textContent = 'Tentativo di riconnessione in corso... Prossimo tentativo fra ' + (retryDelay/1000) + 's';
            // programma il prossimo tentativo con backoff esponenziale
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
                // aumenta delay per il prossimo tentativo
                retryDelay = Math.min(maxDelay, retryDelay * 2);
                doPing();
            }, retryDelay);
            return false;
        }

        // Retry manuale
        document.getElementById('offlineRetry').addEventListener('click', () => {
            retryDelay = 2000;
            clearTimeout(retryTimer);
            doPing();
        });

        // Controllo iniziale e poi controllo periodico (se online)
        doPing();
        setInterval(() => {
            if (!isOffline) doPing();
        }, 10000);
    })();

    // service worker per la cache in offline (usa la route /sw fornita dal server)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw')
        .then(() => console.log('Service worker registrato'))
        .catch(err => console.error('Errore registrazione service worker:', err));
    }
    </script>

    <div id="customContextMenu">
        <div onclick="handleDelete(); document.getElementById('customContextMenu').style.display='none';">Elimina</div>
        <div onclick="handleInfo(); document.getElementById('customContextMenu').style.display='none';">Info</div>
    </div>
    <script>
        let clickedElement = null;
        // Context menu personalizzato
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            
            const contextMenu = document.getElementById('customContextMenu');
            clickedElement = e.target;
            
            // Risali fino a trovare un button con classe 'song'
            const songButton = clickedElement.closest('button.song');
            if (songButton) {
                clickedElement = songButton;
            }
            
            if (!clickedElement.classList.contains('song')) {
                // Se non è una canzone, non mostrare il menu
                return;
            }

            contextMenu.style.display = 'block';
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            
            // console.log('Cliccato su:', clickedElement);
        });

        function handleDelete() {
        if (clickedElement) {
            const songName = clickedElement.textContent.trim();
            if (confirm('Sei sicuro di voler eliminare: ' + songName)) {
                fetch('/delete/'+clickedElement.onclick.toString().match(/playSong\("([^"]+)"\)/)[1])
                .then(response => {
                    if (response.ok) {
                        alert('Canzone eliminata con successo: ' + songName);
                        // Ricarica la pagina per aggiornare la lista delle canzoni
                        window.location.reload();
                    } else {
                        alert('Errore durante l\'eliminazione della canzone: ' + songName);
                    }
                });
            }
        }}

        function handleInfo() {
            if (clickedElement) {
                const songName = clickedElement.textContent.trim();
                fetch('/info?song='+clickedElement.onclick.toString().match(/playSong\("([^"]+)"\)/)[1])
                .then(response => response.json())
                .then(data => {
                    alert('Info sulla canzone: ' + songName + '\nRiproduzioni: '+data.plays);
                });
            }
        }

        // Chiudi il menu quando clicchi altrove
        document.addEventListener('click', function(e) {
            const contextMenu = document.getElementById('customContextMenu');
            if (e.target.id !== 'customContextMenu' && !contextMenu.contains(e.target)) {
                contextMenu.style.display = 'none';
            }
        });

        // Chiudi il menu quando scorri
        document.addEventListener('scroll', function() {
            document.getElementById('customContextMenu').style.display = 'none';
        });


        // per mobile
            let touchStartTime = 0;
            let touchStartX = 0;
            let touchStartY = 0;

            document.addEventListener('touchstart', function(e) {
                touchStartTime = Date.now();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            document.addEventListener('touchend', function(e) {
                const touchDuration = Date.now() - touchStartTime;
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                // Se il tocco è durato più di 500ms e non si è mosso molto = long press
                if (touchDuration > 500 && 
                    Math.abs(touchEndX - touchStartX) < 10 && 
                    Math.abs(touchEndY - touchStartY) < 10) {
                    
                    const contextMenu = document.getElementById('customContextMenu');
                    clickedElement = e.target;
                    
                    // Risali fino a trovare un button con classe 'song'
                    const songButton = clickedElement.closest('button.song');
                    if (songButton) {
                        clickedElement = songButton;
                    }

                    if (!clickedElement.classList.contains('song')) {
                        // Se non è una canzone, non mostrare il menu
                        return;
                    }
                    
                    contextMenu.style.display = 'block';
                    contextMenu.style.left = touchStartX + 'px';
                    contextMenu.style.top = touchStartY + 'px';
                }
            });
    </script>

</body>
</html>
