<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordi canzone</title>
    <link rel="stylesheet" href="/static/style_lyrics_chords.css">
    <script src="https://kit.fontawesome.com/b4ceb7d98e.js" crossorigin="anonymous" defer></script>
    <style>
        input, select{
            border-radius: 20px; padding: 5px;
        }

        #new-chord, #test-chord{
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .new-chor-container{
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #new-chords-container{
            margin-bottom: 10px;
            display: grid;
            gap: 5px;
        }

        @media (max-width: 1400px) {
            #new-chord, #test-chord, #container{
                padding: 20px;
            }
            #new-chords-container{
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- <audio controls id="audioPlayer">
        <source src="http://localhost/Tha%20Supreme/gua10%20-%20feat.%20Lazza.flac" type="audio/flac">
    </audio> -->

    <div id="container">
        <div id="testo-output">Caricamento degli accordi in corso...</div>
    </div>

    <button class="button" onclick="document.getElementById('new-chord').style.display = document.getElementById('new-chord').style.display === 'flex' ? 'none' : 'flex';" style="margin-top: 20px; margin-bottom: 10px;">Aggiungi Accordi</button>
    <div id="new-chord" style="display: none;">
        <div id="new-chords-container"></div>
        
        <button class="button" onclick="addChord()">Aggiungi accordo</button>
        <button class="button" onclick="saveChord()" style="margin-top: 20px;">Salva Accordo</button>
    </div>

    <div id="test-chord" style="display: none; margin-top: 20px;"></div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const song = params.get("song");
        console.log("URL del testo:", song);

        async function fetchChords() {
            const response = await fetch("get_chords/" + song);

            if (!response.ok) {
                if (response.status === 404) {
                    document.getElementById("testo-output").innerHTML = '<p style="color: #ff4d4d;">Accordi non trovati</p>';
                    return null;
                } else {
                    throw new Error(`Errore HTTP: ${response.status}`);
                }
            }

            const data = await response.json();
            return data;
        }

        async function displayChords() {
            const data = await fetchChords();
            if (!data) return;
            data.forEach(element => {
                console.log(element);
            });

            document.getElementById("container").innerHTML =
                data.map(chord => `
                    <div class="chord">
                        ${chord}
                    </div>
                `).join('');

            const tuttiGliSvg = document.querySelectorAll(".chord");
            tuttiGliSvg.forEach(element => {
                const testo = element.querySelector(".text").textContent;
                const regex = /^([A-G])([b#]?)([a-zA-Z0-9]*)\s*\(?(\d*)\)?/;
                const match = testo.match(regex);
                if (match) {
                    const data = {
                        base: match[1],   // D
                        tono: match[2],   // b
                        suffix: match[3], // 7
                        grado: match[4]   // 2
                    };
                    addChord(data);
                }
            });
        }
        
        displayChords();

        async function testChord(btn){
            const row = btn.closest('.chord-row') || btn.parentElement;
    
            const chordBase = row.querySelector(".chord-base").value;
            const tono = row.querySelector(".tono").value;
            const suffix = row.querySelector(".suffix").value;
            const grado = row.querySelector(".grado").value;

            const response = await fetch(`chord?chord=${encodeURIComponent(grado + chordBase + tono + suffix)}`);
            const data = await response.text();
            
            document.getElementById("test-chord").innerHTML = data;
            document.getElementById("test-chord").style.display = "block";
        }

        function addChord(existingData = null) {
            const newChordDiv = document.createElement("div");
            newChordDiv.classList.add("new-chor-container");
            
            // Definiamo i valori di default o quelli passati
            const baseVal = existingData ? existingData.base : "";
            const tonoVal = existingData ? existingData.tono : "";
            const suffixVal = existingData ? existingData.suffix : "";
            const gradoVal = existingData ? existingData.grado : "";

            newChordDiv.innerHTML = `
                <select class="chord-base">
                    <option value="">Seleziona base</option>
                    ${['C','D','E','F','G','A','B'].map(note => 
                        `<option value="${note}" ${baseVal === note ? 'selected' : ''}>${note}</option>`
                    ).join('')}
                </select>
                <select class="tono">
                    <option value="" ${tonoVal === "" ? 'selected' : ''}>Nessuno</option>
                    <option value="b" ${tonoVal === "b" ? 'selected' : ''}>Bemolle</option>
                    <option value="#" ${tonoVal === "#" ? 'selected' : ''}>Diesis</option>
                </select>
                <select class="suffix">
                    <option value="" ${suffixVal === "" ? 'selected' : ''}>Maggiore</option>
                    <option value="m" ${suffixVal === "m" ? 'selected' : ''}>Minore</option>
                    <option value="7" ${suffixVal === "7" ? 'selected' : ''}>Settima</option>
                    <option value="maj7" ${suffixVal === "maj7" ? 'selected' : ''}>Maggiore 7</option>
                    <option value="m7" ${suffixVal === "m7" ? 'selected' : ''}>Minore 7</option>
                </select>
                <input type="number" placeholder="Grado" class="grado" min="0" max="3" value="${gradoVal}">
                <button class="button" style="margin: 0px;" onclick="testChord(this)">Test</button>
                <button class="button" style="margin: 0px;" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash-can"></i></button>
            `;
            document.getElementById("new-chords-container").appendChild(newChordDiv);
        }

        function saveChord() {
            const accordiDaSalvare = [];
            // Seleziona tutte le righe di accordi aggiunte
            const righe = document.querySelectorAll(".new-chor-container");

            righe.forEach(riga => {
                const base = riga.querySelector(".chord-base").value;
                const tono = riga.querySelector(".tono").value;
                const suffix = riga.querySelector(".suffix").value;
                const grado = riga.querySelector(".grado").value;

                // Salviamo solo se c'è almeno la base dell'accordo
                if (base) {
                    accordiDaSalvare.push(grado + base + tono + suffix);
                }
            });

            // Esempio di invio al backend Flask
            fetch('/chord', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    song: song,
                    chords: accordiDaSalvare
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Errore HTTP: ${response.status}`);
                }
                alert("Salvati con successo!")
                window.location.reload(); // Ricarica la pagina per mostrare i nuovi accordi
            })
        }
    </script>
</body>
</html>
