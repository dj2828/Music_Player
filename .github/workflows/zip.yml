name: Zip

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Create zip
      run: |
        zip -qq -r Music_player.zip static templates lib.py main.py README.md requirements.txt server.py

    - name: Create and push tag
      id: create_tag
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      run: |
        TAG=v${{ github.run_number }}
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        tag_name: ${{ steps.create_tag.outputs.tag }}
        release_name: Release ${{ steps.create_tag.outputs.tag }}
        body: |
          SASSO
        draft: true
        prerelease: false

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Music_player.zip
        asset_name: Music_player.zip
        asset_content_type: application/zip

    - name: Publish release
      uses: StuYarrow/publish-release@v1.1.2
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        id: ${{ steps.create_release.outputs.id }}

    - name: Create release on target repo
      id: create_remote_release
      env:
        TARGET_OWNER: dj2828            # sostituisci con l'owner target o usa secret
        TARGET_REPO: aggiorna-dj              # sostituisci con il repo target o usa secret
        TARGET_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
      run: |
        TAG=v${{ github.run_number }}
        echo "Creating release $TAG on $TARGET_OWNER/$TARGET_REPO"
        RESP=$(curl -s -X POST \
          -H "Authorization: token $TARGET_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$TARGET_OWNER/$TARGET_REPO/releases" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"body\":\"SASSO\",\"draft\":true,\"prerelease\":false}")
        echo "$RESP" > release_response.json
        UPLOAD_URL=$(python - <<'PY'
import sys, json
r=json.load(sys.stdin)
print(r.get('upload_url','').split('{')[0])
PY
<<<"$RESP")
        if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
          echo "Failed to create release. Response:"
          cat release_response.json
          exit 1
        fi
        echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT

    - name: Upload asset to target release
      env:
        TARGET_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
      run: |
        UPLOAD_URL="${{ steps.create_remote_release.outputs.upload_url }}"
        echo "Uploading Music_player.zip to $UPLOAD_URL"
        curl -s --fail -X POST \
          -H "Authorization: token $TARGET_TOKEN" \
          -H "Content-Type: application/zip" \
          --data-binary @Music_player.zip "${UPLOAD_URL}?name=Music_player.zip" \
          >/tmp/upload_response.json
        cat /tmp/upload_response.json