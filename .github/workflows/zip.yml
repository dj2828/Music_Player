permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Create zip
      run: |
        zip -qq -r Music_player.zip static templates lib.py main.py README.md requirements.txt server.py

    - name: Create and push tag
      id: create_tag
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      run: |
        TAG=v${{ github.run_number }}
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        tag_name: ${{ steps.create_tag.outputs.tag }}
        release_name: Release ${{ steps.create_tag.outputs.tag }}
        body: |
          SASSO
        draft: true
        prerelease: false

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Music_player.zip
        asset_name: Music_player.zip
        asset_content_type: application/zip

    - name: Publish release
      uses: StuYarrow/publish-release@v1.1.2
      env:
        GITHUB_TOKEN: ${{ secrets.upt }}
      with:
        id: ${{ steps.create_release.outputs.id }}